<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Smart Wheelchair</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

/* height:100vh; */

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(135deg,#0f172a,#1e293b,#111827);


overflow-x:hidden;
overflow-y:auto;


color:white;

min-height:100vh;

padding:20px;

}

.card{

position:relative;

z-index:5;

width:750px;

max-width:90%;

padding:60px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.1);

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.45);

text-align:center;

}

.logo{
    margin-bottom:20px;
}

.logo img{
    width:240px;
    max-width:100%;
    height:auto;
    display:block;
    margin:0 auto;
}

h1{

font-size:48px;

margin-bottom:10px;

color:#fbbf24;

}

h2{

font-size:24px;

font-weight:normal;

color:#d1d5db;

margin-bottom:35px;

}

.info{

font-size:18px;

line-height:1.8;

color:#f3f4f6;

margin-bottom:40px;

}

.creator{

margin-top:25px;

font-size:18px;

color:#cbd5e1;

}

.creator b{

color:#fbbf24;

}

button{

padding:18px 45px;

font-size:22px;

font-weight:bold;

border:none;

border-radius:15px;

cursor:pointer;

background:#f59e0b;

color:white;

transition:.3s;

box-shadow:0 10px 30px rgba(245,158,11,.45);

}

button:hover{

transform:translateY(-4px) scale(1.05);

background:#d97706;

}

.footer{

margin-top:40px;

font-size:14px;

opacity:.7;

}

/* Mobile Responsive */
@media (max-width:768px){


.card{
    width:95%;
    padding:30px 20px;
    border-radius:20px;
}

.logo img{

    width:160px;

}

h1{
    font-size:30px;
    line-height:1.2;
}

h2{
    font-size:18px;
    margin-bottom:25px;
}

.info{
    font-size:16px;
    line-height:1.7;
    margin-bottom:30px;
}

button{
    width:100%;
    padding:16px;
    font-size:18px;
}

.creator{
    font-size:15px;
    line-height:1.6;
}

.footer{
    font-size:12px;
    margin-top:25px;
}

body:before{
    width:350px;
    height:350px;
    top:-150px;
    right:-150px;
    filter:blur(120px);
}

body:after{
    width:300px;
    height:300px;
    bottom:-120px;
    left:-120px;
    filter:blur(120px);
}

}

@media (max-width:480px){

.card{
    padding:25px 18px;
}


.logo img{
    width:130px;
}

h1{
    font-size:26px;
}

h2{
    font-size:16px;
}

.info{
    font-size:14px;
}

button{
    font-size:16px;
    padding:14px;
}

.creator{
    font-size:14px;
}

.footer{
    font-size:11px;
}

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
<img src="./AB5B6732-364A-42E0-9E80-7E419712DC25.png" alt="">
</div>

<h1>SMART WHEELCHAIR</h1>

<h2>Helmet Controlled Smart Wheelchair</h2>

<div class="info">

Real-Time ESP32 Camera<br>

Remote Web Control<br>

GPS Tracking<br>

Smart Safety System

</div>

<button onclick="checkPassword()">

ENTER CONTROL PANEL

</button>

<div class="creator">

Designed & Developed by

<br><br>

<b>Saba Kalantari</b>

<br>

Smart Helmet Controlled Wheelchair Project

</div>

<div class="footer">

© 2026 Smart Wheelchair Project

</div>

</div>
<script>

function checkPassword(){

    let password = prompt("Enter Password:");

    if(password === "1111"){

        location.href = "http://45.94.214.62";

    }else{

        alert("Wrong Password!");

    }

}

</script>
</body>
</html>
