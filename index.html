<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Wheelchair</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="header">
SMART WHEELCHAIR
</div>


<div class="tabs">

<div class="tab active" onclick="openPage(0)">
Dashboard
</div>


<div class="tab" onclick="openPage(1)">
Camera
</div>


<div class="tab" onclick="openPage(2)">
Control
</div>


<div class="tab" onclick="openPage(3)">
GPS
</div>

</div>



<div id="page0" class="page show">


<div class="card center">

<h2>Helmet</h2>

<div id="helmet" class="value green">
ON
</div>

</div>



<div class="card center">

<h2>Direction</h2>

<div id="direction" class="value">
STOP
</div>

<div id="arrow" class="arrow">
⏹
</div>

</div>



<div class="card center">

<h2>Speed</h2>

<div id="speed" class="value blue">
0
</div>

</div>


</div>





<div id="page1" class="page">

<div class="card">

<img class="camera"
src="http://192.168.1.200:81/stream">

</div>

</div>





<div id="page2" class="page">


<div class="card center">

<h2>Control Mode</h2>


<div class="mode-buttons">

<button onclick="setMode('head')" class="mode-btn">
Head Control
</button>


<button onclick="setMode('web')" class="mode-btn">
Web Control
</button>


</div>

</div>





<div class="card center">


<h2>Move</h2>


<div class="control-grid">


<div></div>


<button onclick="sendCmd('forward')" class="btn">
⬆
</button>


<div></div>



<button onclick="sendCmd('left')" class="btn">
⬅
</button>



<button onclick="sendCmd('stop')" class="btn">
■
</button>



<button onclick="sendCmd('right')" class="btn">
➡
</button>



<div></div>


<button onclick="sendCmd('backward')" class="btn">
⬇
</button>


<div></div>


</div>


</div>





<div class="card center">

<h2>Functions</h2>


<button id="lightBtn"
onclick="toggleLight()"
class="mode-btn">

💡 Light ON

</button>



<button id="hazardBtn"
onclick="toggleHazard()"
class="mode-btn">

🚨 Hazard ON

</button>


</div>



</div>





<div id="page3" class="page">


<div class="card center">


<h2>Location</h2>


<button onclick="openGPS()" class="mode-btn">

📍 Open Google Maps

</button>


</div>


</div>



<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="script.js"></script>


</body>

</html>
