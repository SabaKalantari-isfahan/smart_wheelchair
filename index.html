<title>Smart Wheelchair</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(135deg,#0f172a,#1e293b,#111827);

overflow:hidden;

color:white;

}

body:before{

content:"";

position:absolute;

width:700px;
height:700px;

background:#f59e0b;

filter:blur(180px);

opacity:.15;

border-radius:50%;

top:-250px;

right:-250px;

}

body:after{

content:"";

position:absolute;

width:600px;
height:600px;

background:#2563eb;

filter:blur(180px);

opacity:.12;

border-radius:50%;

bottom:-200px;

left:-200px;

}

.card{

position:relative;

z-index:5;

width:750px;

max-width:90%;

padding:60px;

background:rgba(255,255,255,.05);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.1);

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.45);

text-align:center;

}

.logo{

font-size:70px;

margin-bottom:20px;

}

h1{

font-size:48px;

margin-bottom:10px;

color:#fbbf24;

}

h2{

font-size:24px;

font-weight:normal;

color:#d1d5db;

margin-bottom:35px;

}

.info{

font-size:18px;

line-height:1.8;

color:#f3f4f6;

margin-bottom:40px;

}

.creator{

margin-top:25px;

font-size:18px;

color:#cbd5e1;

}

.creator b{

color:#fbbf24;

}

button{

padding:18px 45px;

font-size:22px;

font-weight:bold;

border:none;

border-radius:15px;

cursor:pointer;

background:#f59e0b;

color:white;

transition:.3s;

box-shadow:0 10px 30px rgba(245,158,11,.45);

}

button:hover{

transform:translateY(-4px) scale(1.05);

background:#d97706;

}

.footer{

margin-top:40px;

font-size:14px;

opacity:.7;

}

</style>

</head>

<div class="logo">
