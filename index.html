<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Wheelchair</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    overflow-x:hidden;
    color:#fff;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    background:#f59e0b;
    filter:blur(180px);
    opacity:.15;
    border-radius:50%;
    top:-250px;
    right:-250px;
    z-index:0;
}

body::after{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:#2563eb;
    filter:blur(180px);
    opacity:.12;
    border-radius:50%;
    bottom:-200px;
    left:-200px;
    z-index:0;
}

.card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:750px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
    padding:60px;
    text-align:center;
}

.logo{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    color:#fbbf24;
    font-size:48px;
    line-height:1.2;
    text-align:center;
    margin-bottom:10px;
}

h2{
    color:#d1d5db;
    font-size:24px;
    font-weight:400;
    margin-bottom:35px;
}

.info{
    font-size:18px;
    line-height:1.8;
    margin-bottom:40px;
}

button{
    background:#f59e0b;
    color:#fff;
    border:none;
    border-radius:15px;
    padding:18px 45px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 10px 30px rgba(245,158,11,.45);
}

button:hover{
    background:#d97706;
    transform:scale(1.05);
}

.creator{
    margin-top:30px;
    font-size:18px;
    color:#cbd5e1;
    line-height:1.8;
}

.creator b{
    color:#fbbf24;
}

.footer{
    margin-top:30px;
    font-size:14px;
    opacity:.7;
}

/* Mobile */

@media (max-width:768px){

.card{
    padding:30px 20px;
}

.logo{
    font-size:50px;
}

h1{
    font-size:30px;
}

h2{
    font-size:18px;
}

.info{
    font-size:16px;
}

button{
    width:100%;
    font-size:18px;
    padding:16px;
}

.creator{
    font-size:16px;
}

}

@media (max-width:400px){

h1{
    font-size:24px;
}

h2{
    font-size:16px;
}

.info{
    font-size:14px;
}

.creator{
    font-size:14px;
}

button{
    font-size:16px;
}

}

</style>
</head>

<body>

<div class="card">

<div class="logo">🦽</div>

<h1>SMART WHEELCHAIR</h1>

<h2>Helmet Controlled Smart Wheelchair</h2>

<div class="info">
Real-Time ESP32 Camera<br>
Remote Web Control<br>
GPS Tracking<br>
Smart Safety System
</div>

<button onclick="location.href='http://45.94.214.62'">
ENTER CONTROL PANEL
</button>

<div class="creator">
Designed &amp; Developed by
<br><br>
<b>Saba Kalantari</b>
<br>
Smart Helmet Controlled Wheelchair Project
</div>

<div class="footer">
© 2026 Smart Wheelchair Project
</div>

</div>

</body>
</html>
